<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos com DOM</title>
    <style>
      body {
        background: rgb(68, 125, 199);
        color: white;
        font: normal 18pt Arial;
      }
    </style>
  </head>
  <body>
    <h1>Iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em Javascript.</p>
    <div class="msg">Clique em mim</div>
    <script>
      var p = window.document.getElementsByTagName('p')[1]
      window.document.write('Está escrito em p: ' + p.innerHTML)
      p.style.color = 'red'
      // Select div by class
      var d1 = window.document.getElementsByClassName('msg')[0]
      d1.innerText = 'my div2'      
      // Select by id using # | Select by class using .
      var d2 = window.document.querySelector('div.msg')
      d2.style.background = 'green'
    </script>
  </body>
</html>
