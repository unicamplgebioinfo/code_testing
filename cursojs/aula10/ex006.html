<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
      div#area {
        background: rgb(42, 139, 42);
        color: white;
        font: normal 15pt Arial;
        width: 200px;
        height: 200px;
        line-height: 200px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="area">
      Interajaaaaaa...
    </div>
    <script>
      var d = window.document.getElementById('area')
      d.addEventListener('click', clicar)
      d.addEventListener('mouseenter', entrar)
      d.addEventListener('mouseout', sair)

      function clicar() {
        d.innerText = 'Clicou!'
        d.style.background = 'red'
      }
      function entrar() {
        d.innerText = 'Entrou!'
      }
      function sair() {
        d.innerText = 'Saiu!'
        d.style.background = 'green'
      }
    </script>
  </body>
</html>
